<style>
:root{color-scheme:light;--ink:#14282b;--muted:#466065;--paper:#f3f6f3;--card:#fff;--line:#cad8d2;--green:#145746;--dark:#102e2b}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}a{color:var(--green);text-underline-offset:.18em}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--green);border-radius:8px;padding:.55rem .85rem;background:white;color:var(--green);font-weight:650}button:hover{background:#e3efe9}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white}button.primary:hover{background:var(--dark)}:focus-visible{outline:3px solid #b76c18;outline-offset:3px}[hidden]{display:none!important}
.wrap{max-width:1330px;margin:auto;padding-inline:clamp(18px,4vw,60px)}header{background:var(--dark);color:white;padding:clamp(28px,5vw,64px) 0 30px}header p{color:#d1e7dd}h1,h2,h3,p{margin:0}h1{font:700 clamp(34px,5vw,66px)/1.04 Georgia,serif;letter-spacing:-.035em;max-width:850px}h2{font:700 clamp(27px,3vw,39px)/1.16 Georgia,serif}h3{line-height:1.3}nav{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}nav a{color:#dbf2e7}#updated{margin-top:14px;font-size:1rem}
main>section{margin-block:32px 45px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.5vw,30px)}.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.news-grid h3{margin-bottom:8px}.news-grid details{margin-top:10px}.news-grid ul{padding-left:21px;margin-block:7px}.news-grid li+li{margin-top:5px}summary{cursor:pointer;font-weight:650;color:var(--green)}
.search{display:grid;gap:5px;font-weight:650}.search input,select{width:100%;min-width:0;border:1px solid #899f97;border-radius:8px;padding:.55rem .65rem;background:white;color:var(--ink)}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}.filters label{display:grid;gap:5px;font-size:.95rem;font-weight:650}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}.actions div{display:flex;gap:8px;flex-wrap:wrap}.count,.meta{color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0}.timeline li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.timeline li:last-child{border:0}.timeline time{font-variant-numeric:tabular-nums;font-weight:700}.link-button{background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-underline-offset:.18em}.timeline p{margin-top:4px;color:var(--muted)}dialog{width:min(760px,calc(100% - 26px));max-height:88vh;border:1px solid var(--line);border-radius:14px;padding:0;color:var(--ink)}dialog::backdrop{background:#102e2baa}.dialog-head{position:sticky;top:0;background:#fff;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.dialog-head h2{font-size:1.7rem}.dialog-body{padding:18px 22px 25px}.dialog-body h3{margin:18px 0 6px}.dialog-body ul{margin-top:6px;padding-left:22px}.dialog-body p,.dialog-body dd{overflow-wrap:anywhere}.dialog-body dl{display:grid;grid-template-columns:145px 1fr;gap:6px;margin:0}.dialog-body dt{font-weight:700}.dialog-body dd{margin:0}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Biblioteca de normativa de IA</h1>
    <p id="updated"></p>
    <nav aria-label="Secciones"><a href="#novedades">Novedades</a><a href="#documentos">Documentos</a><a href="#cronologia">Línea de tiempo</a></nav>

<main class="wrap">

  <section id="documentos" aria-labelledby="documents-title">

    </form>
    <div class="cards" id="cards"></div>
    <p class="panel" id="empty" hidden>No hay documentos que coincidan con la búsqueda.</p>
  </section>
  <section id="cronologia" aria-labelledby="timeline-title">
    <div class="section-head"><h2 id="timeline-title">Línea de tiempo</h2></div>
    <div class="panel"><ol class="timeline" id="timeline"></ol><p id="timeline-empty" hidden>No hay fechas clave con día confirmado.</p></div>
  </section>
</main>

  <div class="dialog-body" id="fiche-body"></div>
</dialog>

lines":["- PENDIENTE"]},{"title":"Comprobaciones","lines":["- El archivo es un resumen informal de una sentencia. El resumen carece de fuerza vinculante y recoge el resultado para las partes. Firmeza PENDIENTE. Comprobar el fallo y el registro de recursos."]}],"fechasClave":[{"fecha":"2025-11-11","texto":"Fecha de la sentencia según el resumen de la OMPI."}]},{"id":"C05","tipo":"caso","ambito":"Otro país","organismo":"Civil Resolution Tribunal de Columbia Británica","titulo":"Moffatt contra Air Canada, 2024 BCCRT 149","fecha":"2024-02-14","estado":"PENDIENTE","vinculante":"sí","temas":"responsabilidad y consumidores","resumen":"El tribunal responsabilizó a Air Canada por información errónea de su chatbot sobre la tarifa por duelo. Ordenó pagar 812,02 dólares por daños, intereses y tasas.","archivo":"casos/2024-02-14_civil-resolution-tribunal_moffatt-contra-air-canada.pdf","ficha":"fichas/2024-02-14_civil-resolution-tribunal_moffatt-contra-air-canada.md","url":"https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do","fecha_consulta":"2026-11-26","fecha_alta":"2026-11-26","notas":"Otro país (Canadá). Los apartados 44 a 47 recogen la orden y su ejecución mediante el tribunal provincial. Firmeza PENDIENTE. Verificar si hubo impugnación.","fichaMarkdown":"# Moffatt contra Air Canada, 2024 BCCRT 149\n\n| Campo | Valor |\n|---|---|\n| ID | C05 |\n| Tipo | caso |\n| Ámbito | Otro país (Canadá) |\n| Organismo | Civil Resolution Tribunal de Columbia Británica |\n| Fecha | 2024-02-14 |\n| Estado | PENDIENTE |\n| Vinculante | sí |\n| Temas | responsabilidad y consumidores |\n| Idioma | en |\n| Archivo | `casos/2024-02-14_civil-resolution-tribunal_moffatt-contra-air-canada.pdf` |\n| URL oficial | \u003chttps://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do> |\n| Fecha de consulta | 2026-11-26 |\n\n## Resumen (tres líneas)\n\nEl tribunal responsabilizó a Air Canada por información errónea de su chatbot sobre la tarifa por duelo. Ordenó pagar 812,02 dólares por daños, intereses y tasas.\n\n## Para qué me sirve\n\nRevisar que las respuestas de un chatbot de atención al público coincidan con las condiciones del servicio.\n\n## Fechas clave\n\n- 2024-02-14 — Emisión de la resolución. La orden fija 14 días para el pago.\n\n## Relacionado con\n\n- PENDIENTE\n\n## Comprobaciones\n\n- Los apartados 44 a 47 recogen la orden y su ejecución mediante el tribunal provincial. Firmeza PENDIENTE. Verificar si hubo impugnación.\n","fichaTitulo":"Moffatt contra Air Canada, 2024 BCCRT 149","fichaCampos":[["ID","C05"],["Tipo","caso"],["Ámbito","Otro país (Canadá)"],["Organismo","Civil Resolution Tribunal de Columbia Británica"],["Fecha","2024-02-14"],["Estado","PENDIENTE"],["Vinculante","sí"],["Temas","responsabilidad y consumidores"],["Idioma","en"],["Archivo","`casos/2024-02-14_civil-resolution-tribunal_moffatt-contra-air-canada.pdf`"],["URL oficial","\u003chttps://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do>"],["Fecha de consulta","2026-11-26"]],"fichaSecciones":[{"title":"Resumen (tres líneas)","lines":["El tribunal responsabilizó a Air Canada por información errónea de su chatbot sobre la tarifa por duelo. Ordenó pagar 812,02 dólares por daños, intereses y tasas."]},{"title":"Para qué me sirve","lines":["Revisar que las respuestas de un chatbot de atención al público coincidan con las condiciones del servicio."]},{"title":"Fechas clave","lines":["- 2024-02-14 — Emisión de la resolución. La orden fija 14 días para el pago."]},{"title":"Relacionado con","lines":["- PENDIENTE"]},{"title":"Comprobaciones","lines":["- Los apartados 44 a 47 recogen la orden y su ejecución mediante el tribunal provincial. Firmeza PENDIENTE. Verificar si hubo impugnación."]}],"fechasClave":[{"fecha":"2024-02-14","texto":"Emisión de la resolución. La orden fija 14 días para el pago."}]}],"stateChanges":[]}

<script>
'use strict';
const {updated, columns, documents, stateChanges} = JSON.parse(document.getElementById('biblioteca-datos').textContent);
const byId = id => document.getElementById(id);
const normalize = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const labels = {norma:'Norma',guia:'Guía',caso:'Caso',orientativo:'Orientativo',vigente:'Vigente',firme:'Firme','en tramitación':'En tramitación','aplicación diferida':'Aplicación diferida','recurrido / anulado':'Recurrido / anulado',decaído:'Decaído',PENDIENTE:'Pendiente',sí:'Sí',no:'No',parcial:'Parcial'};
const tones = {vigente:'green',firme:'green',orientativo:'blue','en tramitación':'amber','aplicación diferida':'amber','recurrido / anulado':'red',decaído:'red'};
const themes = doc => String(doc.temas || '').split(';').map(theme => theme.trim()).filter(Boolean);
const element = (tag, text, className) => {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
};
function safeLink(url, label) {
  if (!/^https?:\/\//i.test(url || '')) return element('span', label);
  const link = element('a', label);
  link.href = url;
  return link;
}
function appendContent(node, text) {
  const parts = text.split(/(\[[^\]\n]+\]\(https?:\/\/[^\s)]+\)|<https?:\/\/[^>]+>|`[^`]+`)/g);
  for (const part of parts) {
    const link = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);
    if (link) node.append(safeLink(link[2], link[1]));
    else if (/^<https?:/.test(part)) node.append(safeLink(part.slice(1,-1), part.slice(1,-1)));
    else if (part.startsWith('`') && part.endsWith('`')) node.append(element('code', part.slice(1,-1)));
    else node.append(document.createTextNode(part));
  }
}
function fichaButton(doc, label, className) {
  const button = element('button', label, className);
  button.type = 'button';
  button.addEventListener('click', () => showFicha(doc));
  return button;
}
function showFicha(doc) {
  byId('fiche-title').textContent = doc.fichaTitulo || doc.titulo;
  const body = byId('fiche-body');
  body.replaceChildren();
  const fields = element('dl');
  for (const [field,value] of doc.fichaCampos) {
    const info = element('dd');
    appendContent(info,value);
    fields.append(element('dt',field), info);
  }
  if (doc.fichaCampos.length) body.append(fields);
  if (!doc.fichaCampos.length && !doc.fichaSecciones.length) body.append(element('p','Ficha pendiente.'));
  for (const {title, lines} of doc.fichaSecciones) {
    body.append(element('h3',title));
    let list = null;
    for (const line of lines) {
      if (/^-\s/.test(line)) {
        if (!list) { list = element('ul'); body.append(list); }
        const li = element('li');
        appendContent(li,line.slice(2));
        list.append(li);
      } else {
        list = null;
        const p = element('p');
        appendContent(p,line);
        body.append(p);
      }
    }
  }
  byId('fiche').showModal();
  body.parentElement.scrollTop = 0;
}
const specs = [
  ['tipo','Tipo',doc=>[doc.tipo]], ['ambito','Ámbito',doc=>[doc.ambito]],
  ['tema','Tema',themes], ['estado','Estado',doc=>[doc.estado]], ['vinculante','Vinculante',doc=>[doc.vinculante]]
];
for (const [key,label,values] of specs) {
  const wrapper = element('label',label);
  const select = element('select');
  select.id = key;
  select.add(new Option('Todos',''));
  const options = [...new Set(documents.flatMap(values).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  for (const value of options) select.add(new Option(labels[value] || value,value));
  wrapper.append(select);
  byId('selects').append(wrapper);
}
const shownDocuments = () => {
  const terms = normalize(byId('query').value).trim().split(/\s+/).filter(Boolean);
  return documents.filter(doc => {
    const searchable = normalize([doc.titulo,doc.organismo,doc.resumen,doc.temas].join(' '));
    return terms.every(term=>searchable.includes(term)) && specs.every(([key,,values])=>!byId(key).value || values(doc).includes(byId(key).value));
  });
};
function renderCards() {
  const visible = shownDocuments();
  byId('count').textContent = `${visible.length} de ${documents.length} documentos`;
  byId('empty').hidden = visible.length !== 0;
  byId('export').disabled = visible.length === 0;
  byId('cards').replaceChildren(...visible.map(doc => {
    const card = element('article',null,'card panel');
    const state = element('span',labels[doc.estado] || doc.estado || 'Pendiente','pill');
    state.dataset.tone = tones[doc.estado] || '';
    const links = element('div',null,'links');
    links.append(fichaButton(doc,'Ver ficha'));
    if (doc.url) links.append(safeLink(doc.url,'Fuente oficial'));
    card.append(state, element('h3',doc.titulo), element('p',[doc.organismo,doc.fecha || 'PENDIENTE'].filter(Boolean).join(' · '),'meta'),
      element('p',doc.resumen || 'PENDIENTE','excerpt'),links);
    return card;
  }));
}
function exportCsv() {
  const cell = value => {
    let text = String(value ?? '');
    if (/^\s*[=+\-@]|^[\t\r\n]/.test(text)) text = "'" + text;
    return '"' + text.replaceAll('"','""') + '"';
  };
  const rows = [columns, ...shownDocuments().map(doc=>columns.map(key=>doc[key]))];
  const csv = '\ufeff' + rows.map(row=>row.map(cell).join(';')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const link = element('a');
  link.href = url;
  link.download = `biblioteca-${updated}.csv`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function renderNews() {
  const day = Date.parse(updated + 'T00:00:00Z');
  const lower = new Date(day - 27 * 86400000).toISOString().slice(0,10);
  const recent = documents.filter(doc=>doc.fecha_alta && doc.fecha_alta >= lower && doc.fecha_alta <= updated)
    .sort((a,b)=>b.fecha_alta.localeCompare(a.fecha_alta) || a.titulo.localeCompare(b.titulo,'es'));
  byId('recent-count').textContent = recent.length
    ? `${recent.length} ${recent.length===1?'alta registrada':'altas registradas'} · ${lower} a ${updated}`
    : 'Sin altas registradas en este período.';
  byId('recent').hidden = !recent.length;
  for (const doc of recent) {
    const li = element('li');
    li.append(fichaButton(doc,doc.titulo,'link-button'),document.createTextNode(' · '+doc.fecha_alta));
    byId('recent-list').append(li);
  }
  if (!stateChanges.length) {
    byId('changes').append(element('p','Sin cambios de estado verificados en los informes disponibles.'));
    return;
  }
  const list = element('ul');
  for (const entry of stateChanges) {
    const item = element('li');
    item.append(element('time',entry.fecha),document.createTextNode(' · '));
    const doc = documents.find(doc=>doc.id === entry.id);
    if (doc) item.append(fichaButton(doc,doc.titulo,'link-button'),document.createTextNode(' · '));
    item.append(document.createTextNode(`${entry.anterior} → ${entry.nuevo}`));
    if (entry.url) item.append(document.createTextNode(' · '),safeLink(entry.url,'Fuente'));
    list.append(item);
  }
  byId('changes').append(list);
}
function renderTimeline() {
  const events = documents.flatMap(doc=>doc.fechasClave.map(event=>({...event,doc})))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha) || a.doc.id.localeCompare(b.doc.id));
  byId('timeline-empty').hidden = events.length > 0;
  for (const event of events) {
    const item = element('li');
    const date = element('time',event.fecha);
    date.dateTime = event.fecha;
    const description = element('div');
    description.append(fichaButton(event.doc,event.doc.titulo,'link-button'),element('p',event.texto));
    item.append(date,description);
    byId('timeline').append(item);
  }
}
byId('updated').textContent = 'Última actualización · ' + updated;
byId('query').addEventListener('input',renderCards);
byId('selects').addEventListener('change',renderCards);
byId('filters').addEventListener('reset',()=>setTimeout(renderCards,0));
byId('filters').addEventListener('submit',event=>event.preventDefault());
byId('export').addEventListener('click',exportCsv);
renderNews();
renderCards();
renderTimeline();
</script>
